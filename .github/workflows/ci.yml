name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Self-hosted on the maintainer's Mac: GitHub's macOS images don't have Xcode 27
    # and the macOS 27 SDK yet. The repo is public, so pull requests from forks never
    # run here (they would run their code on that Mac); only pushes and same-repo PRs.
    # `gui`: a runner in a logged-in desktop session, which Playwright's WebKit and
    # Obsidian need to open a window.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, xcode27, gui]
    env:
      # The tests that time themselves: `Test packages` skips them, `Timing tests` runs them.
      TIMED: >-
        \.(PerformanceTests|ScalePerformanceTests|MathPerformanceTests)/|GuideTests/matchingBudgets|StarterGalleryTests/pickerAndCreateAreFast|CollabTests/keyToCaretWithTwoPeopleTyping|VoiceOverTreeTests/largeMapsCostNothingUntilRead|SyncTests/typingStaysFastWhileALibrarySyncs
    steps:
      - uses: actions/checkout@v7

      - name: Xcode
        run: xcodebuild -version

      - name: Lint
        # Swift formatting, and the brand checks (no old mark, document icon up to date).
        run: scripts/lint.sh

      - name: Build packages
        run: swift build

      - name: Test packages
        # Everything but the timing tests, in parallel.
        run: swift test --skip "$TIMED"

      - name: Timing tests
        # The frame and load budgets (README §12, A4, D297), one test at a time once the
        # rest are done: under the parallel run the 5,000-topic zoom took 13.5 ms against 8.3
        # (D493).
        run: swift test --no-parallel --filter "$TIMED"

      - name: Test the server
        # The OpenNexus Server (M44): its own package, with its own dependencies.
        working-directory: server
        run: swift test

      - uses: actions/setup-node@v7
        # One Node for the web tools whichever Mac runs the job: they need 22.22.2, 24.15
        # or 26 (web/package.json), and on an older Node npm quietly skips rolldown's
        # native binding, so Vitest can't start.
        with:
          node-version: 26

      - name: Web viewer
        # Typecheck, ESLint, Vitest, and Playwright in Chromium and WebKit (M43); Firefox
        # where it starts, not on macOS 27 (D326, playwright.config.ts).
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium webkit
          npm run check

      - name: Build app
        run: |
          xcodebuild -project App/OpenNexus.xcodeproj -scheme OpenNexus -configuration Debug \
            -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO build
