name: Viewer site

# The viewer site that opens share links (M44): web/viewer-app, built to dist/ and served by
# GitHub Pages. It's static: no server code, no analytics, and the key in a link's fragment
# never reaches it. CI (ci.yml) tests it; this only builds and publishes it.
#
# The custom domain is set in the repository's Pages settings (D327); until then the site
# is at https://jvaudio.github.io/opennexus/.

on:
  push:
    branches: [main]
    paths: ["web/viewer-app/**", "web/viewer-core/src/**", "web/package-lock.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build -w viewer-app

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/viewer-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
