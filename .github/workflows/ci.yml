name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Self-hosted on the maintainer's Mac: GitHub's macOS images don't have Xcode 27
    # and the macOS 27 SDK yet. The repo is public, so pull requests from forks never
    # run here (they would run their code on that Mac); only pushes and same-repo PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, xcode27]
    steps:
      - uses: actions/checkout@v7

      - name: Xcode
        run: xcodebuild -version

      - name: Lint
        run: swift format lint --strict -r Sources Tests App/OpenNexus

      - name: Build packages
        run: swift build

      - name: Test packages
        run: swift test

      - name: Build app
        run: |
          xcodebuild -project App/OpenNexus.xcodeproj -scheme OpenNexus -configuration Debug \
            -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO build
