<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings, General</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B44D8}a:hover{color:#2F29A8}
.nav{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:8px;font-size:13px}
.ic{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#FFFFFF;font:600 11px/1 -apple-system,sans-serif;flex-shrink:0}
.sec{break-inside:avoid;margin-bottom:18px;display:flex;flex-direction:column;gap:7px}
.st{font-size:12px;font-weight:600;color:#5D5D68;padding-left:4px}
.grp{background:#FFFFFF;border-radius:12px;border:1px solid #E6E6EA;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:7px 14px;border-top:1px solid #F0F0F2;min-height:24px}
.row:first-child{border-top:0}
.lb{font-size:13px;color:#17171C}
.sb{font-size:11.5px;line-height:1.35;color:#6B6B76}
.pop{height:24px;padding:0 9px;border-radius:6px;border:1px solid #DCDCE2;background:#FFFFFF;font:500 12px/1 -apple-system,Geist,sans-serif;color:#17171C;white-space:nowrap}
.seg{display:flex;padding:2px;border-radius:7px;background:#EDEDF1}
.seg span{height:22px;padding:0 9px;display:flex;align-items:center;border-radius:5px;font-size:11.5px;white-space:nowrap}
.k{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:22px;padding:0 7px;box-sizing:border-box;border-radius:5px;background:#17171C;color:#FFFFFF;font:500 11.5px/1 "Geist Mono",monospace}
.ft{font-size:11.5px;line-height:1.4;color:#6B6B76;padding:0 4px}
.card{break-inside:avoid;margin-bottom:18px;padding:16px;border-radius:12px;background:#FFFFFF;border:1px solid #E6E6EA;display:flex;flex-direction:column;gap:10px}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 28px; background: #E4E4E9; font-family: -apple-system, 'SF Pro Text', Geist, system-ui, sans-serif; color: #17171C">
  <div style="height: 100%; display: flex; border-radius: 14px; overflow: hidden; background: #F6F6F8; box-shadow: 0 30px 80px rgba(23,23,28,.18)">
    <div style="width: 236px; flex-shrink: 0; box-sizing: border-box; padding: 16px 10px; background: rgba(236,236,240,.95); border-right: 1px solid #DCDCE2; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; gap: 8px; padding: 2px 6px 14px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span></div>
      <label for="ss" style="position: absolute; left: -9999px">Search settings</label>
      <input id="ss" placeholder="Search" style="height: 28px; box-sizing: border-box; border-radius: 7px; border: 1px solid #DCDCE2; background: #FFFFFF; padding: 0 10px; font: 13px -apple-system, sans-serif; margin-bottom: 10px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="10">
        <div class="nav" style="background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.fw}}"><span class="ic" style="background: {{n.c}}">{{n.g}}</span>{{n.t}}</div>
      </sc-for>
      <div style="flex: 1"></div>
      <span style="font-size: 11px; color: #8A8A96; padding: 0 10px">⌘, opens Settings · ⌘F searches every pane</span>
    </div>
    <div style="flex: 1; min-width: 0; box-sizing: border-box; padding: 24px 30px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-size: 22px; font-weight: 700">{{title}}</h1><span style="font-size: 13px; color: #5D5D68">{{sub}}</span></div>
      <div style="columns: 2; column-gap: 22px">
        <sc-for list="{{sections}}" as="s" hint-placeholder-count="4">
          <div class="sec">
            <span class="st">{{s.t}}</span>
            <div class="grp">
              <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="4">
                <div class="row">
                  <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span class="lb">{{r.l}}</span><sc-if value="{{r.hasD}}" hint-placeholder-val="{{false}}"><span class="sb">{{r.d}}</span></sc-if></div>
                  <sc-if value="{{r.isT}}" hint-placeholder-val="{{false}}"><button role="switch" aria-checked="{{r.on}}" aria-label="{{r.l}}" style="flex-shrink: 0; width: 34px; height: 20px; padding: 0; border: 0; border-radius: 999px; background: {{r.tbg}}; position: relative"><span style="position: absolute; top: 2px; left: {{r.kx}}px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.2)"></span></button></sc-if>
                  <sc-if value="{{r.isS}}" hint-placeholder-val="{{false}}"><button class="pop" aria-label="{{r.l}}">{{r.v}}  ▾</button></sc-if>
                  <sc-if value="{{r.isG}}" hint-placeholder-val="{{false}}"><div class="seg" role="group" aria-label="{{r.l}}"><sc-for list="{{r.opts}}" as="o" hint-placeholder-count="3"><span style="background: {{o.bg}}; box-shadow: {{o.sh}}; font-weight: {{o.fw}}">{{o.t}}</span></sc-for></div></sc-if>
                  <sc-if value="{{r.isR}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0"><span style="width: 120px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #5850EC {{r.pct}}%, #DCDCE2 {{r.pct}}%); position: relative"><span style="position: absolute; left: calc({{r.pct}}% - 8px); top: -6px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.3)"></span></span><span style="font: 500 11.5px/1 'Geist Mono', monospace; color: #4A4A55; min-width: 38px">{{r.v}}</span></div></sc-if>
                  <sc-if value="{{r.isB}}" hint-placeholder-val="{{false}}"><button class="pop">{{r.v}}</button></sc-if>
                  <sc-if value="{{r.isK}}" hint-placeholder-val="{{false}}"><span class="k">{{r.v}}</span></sc-if>
                  <sc-if value="{{r.isI}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #5D5D68; text-align: right; white-space: nowrap">{{r.v}}</span></sc-if>
                </div>
              </sc-for>
            </div>
            <sc-if value="{{s.hasF}}" hint-placeholder-val="{{false}}"><span class="ft">{{s.f}}</span></sc-if>
          </div>
        </sc-for>
        <div class="card">
          <div style="display: flex; gap: 12px; align-items: center">
            <div style="width: 52px; height: 52px; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center"><svg width="52" height="52" style="display: block" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" aria-hidden="true"><defs><linearGradient id="iris-setgeneral" x1="0.29" y1="0.05" x2="0.71" y2="0.95"><stop offset="0" stop-color="#6E67F6"/><stop offset="1" stop-color="#4C43DB"/></linearGradient></defs><rect width="1024" height="1024" fill="url(#iris-setgeneral)"/><g transform="translate(155.43 155.43) scale(11.14)"><path d="M35.69 21.9 A14 14 0 1 0 35.69 42.1" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/><path d="M26 32 C36 32 40 22 50 19" fill="none" stroke="#8CF0E6" stroke-width="3.74" stroke-linecap="round"/><path d="M26 32 C36 32 40 42 50 45" fill="none" stroke="#FFD27A" stroke-width="3.74" stroke-linecap="round"/><circle cx="51" cy="18.6" r="5.22" fill="#8CF0E6"/><circle cx="51" cy="45.4" r="5.22" fill="#FFD27A"/><circle cx="26" cy="32" r="6.48" fill="#FFFFFF"/></g></svg></div>
            <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 700">OpenNexus 1.0</span><span style="font-size: 12px; color: #5D5D68">[BUILD NUMBER] · Open source · [LICENCE]</span></div>
          </div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap"><button class="pop">Source code</button><button class="pop">Release notes</button><button class="pop">Report an issue…</button></div>
          <span class="sb">Usage statistics are off. See Privacy &amp; Data.</span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ACTIVE = 'General';
    const N = [['General', 'G', '#8E8E96'], ['Editing', 'E', '#1E8BE0'], ['Appearance', 'A', '#D6408B'], ['Files & Backup', 'F', '#E08A00'], ['AI', '✦', '#0F7F7A'], ['Shortcuts', '⌘', '#5850EC'], ['Export', '↗', '#C25E00'], ['Integrations', '⇄', '#7A4CC2'], ['Privacy & Data', '◐', '#17171C'], ['Accessibility', '◎', '#1E6FB8']];
    const nav = N.map(([t, g, c]) => ({ t, g, c, bg: t === ACTIVE ? c : 'transparent', fg: t === ACTIVE ? '#FFFFFF' : '#17171C', fw: t === ACTIVE ? 600 : 400 }));
    const base = (l, d) => ({ l, d: d || '', hasD: !!d, isT: false, isS: false, isG: false, isR: false, isB: false, isK: false, isI: false });
    const T = (l, d, on) => Object.assign(base(l, d), { isT: true, on: on ? 'true' : 'false', tbg: on ? '#34C759' : '#DCDCE2', kx: on ? 16 : 2 });
    const S = (l, d, v) => Object.assign(base(l, d), { isS: true, v });
    const G = (l, d, opts, i) => Object.assign(base(l, d), { isG: true, opts: opts.map((t, j) => ({ t, bg: j === i ? '#FFFFFF' : 'transparent', sh: j === i ? '0 1px 2px rgba(0,0,0,.12)' : 'none', fw: j === i ? 600 : 400 })) });
    const R = (l, d, pct, v) => Object.assign(base(l, d), { isR: true, pct, v });
    const B = (l, d, v) => Object.assign(base(l, d), { isB: true, v });
    const K = (l, d, v) => Object.assign(base(l, d), { isK: true, v });
    const I = (l, d, v) => Object.assign(base(l, d), { isI: true, v });
    const sec = (t, rows, f) => ({ t, rows, f: f || '', hasF: !!f });
    const sections = [
      sec('App', [
        G('Appearance', '', ['Auto', 'Light', 'Dark'], 0),
        S('Language', 'Restart applies the change', 'System (English)'),
        S('At launch, open', '', 'Last documents'),
        G('Open documents in', '', ['Tabs', 'Windows'], 0),
        T('Restore windows when reopening', '', true)
      ]),
      sec('Writing', [
        T('Check spelling while typing', '', true),
        T('Correct spelling automatically', '', false),
        T('Smart quotes and dashes', 'Off inside code blocks and metadata', true),
        G('Units', 'Used by export, print and layout fields', ['pt', 'px', 'mm'], 0)
      ]),
      sec('Updates', [
        T('Check for updates automatically', '', true),
        T('Install updates automatically', '', false),
        G('Channel', '', ['Stable', 'Beta'], 0),
        B('Last checked today', '', 'Check now')
      ]),
      sec('Help & tips', [
        T('Progressive tips', 'Suggest a key after you mouse to the same command 3 times', true),
        T('Hint keycaps on empty canvases', 'Tab · Return · / fade after the first keystroke', true),
        I('Hold ⌘ cheat sheet', 'Always on'),
        B('First-run tour', '', 'Replay tour'),
        B('What’s new in this version', '', 'Show')
      ])
    ];
    return { nav, sections, title: 'General', sub: 'App-wide behaviour. Per-document look lives in the Format panel (⌘I).' };
  }
}
</script>
</body>
</html>
