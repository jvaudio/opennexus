<h1>OpenNexus Viewer</h1>
<p>This site opens maps shared from OpenNexus. A share link carries its key after the <code>#</code>, which your browser never sends to any server, so the map is decrypted here, on your device.</p>
<p>OpenNexus is a free mind-mapping and diagramming app for the Mac: <a href="https://github.com/jvaudio/opennexus">github.com/jvaudio/opennexus</a>.</p>
</main>
