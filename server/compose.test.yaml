# The share tests' services (scripts/test-share.sh): MinIO, the server storing on disk, and
# the server storing in MinIO. Ports are on 127.0.0.1 only.
name: opennexus-share-test
services:
  minio:
    build: test/minio
    image: opennexus-test-minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: onxtest
      MINIO_ROOT_PASSWORD: onxtest-secret-key
    ports:
      - "127.0.0.1:19000:9000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      retries: 30
  server:
    build: .
    image: opennexus-server
    environment:
      OPENNEXUS_UPLOAD_TOKEN: test-upload-token-0123456789
    ports:
      - "127.0.0.1:18787:8787"
  server-s3:
    image: opennexus-server
    environment:
      OPENNEXUS_UPLOAD_TOKEN: test-upload-token-0123456789
      OPENNEXUS_STORAGE: s3
      OPENNEXUS_S3_ENDPOINT: http://minio:9000
      OPENNEXUS_S3_BUCKET: onx-server
      OPENNEXUS_S3_ACCESS_KEY: onxtest
      OPENNEXUS_S3_SECRET_KEY: onxtest-secret-key
    ports:
      - "127.0.0.1:18788:8787"
    depends_on:
      server:
        condition: service_started
      minio:
        condition: service_healthy
